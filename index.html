<style>
body{margin:0}
/* Layout: una agenda de bolsillo — columna angosta, hora a la izquierda como en un cuaderno, barra de pestañas abajo para el profesional */
:root {
  --bg: #F2F4F1;
  --surface: #FFFFFF;
  --ink: #1B2320;
  --muted: #5B6862;
  --line: #DBE1DD;
  --accent: #3352A0;
  --accent-ink: #FFFFFF;
  --accent-soft: #E6EBF6;
  --free: #E3EEE7;
  --free-ink: #2F5C45;
  --warn: #8A5A12;
  --warn-soft: #F7EEDC;
  --danger: #A93838;
  --danger-soft: #F7E5E5;
  --shadow: 0 1px 2px rgba(27, 35, 32, .06), 0 4px 16px rgba(27, 35, 32, .06);
  --f-display: "Literata", Georgia, "Times New Roman", serif;
  --f-ui: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111614; --surface: #1A201E; --ink: #E5ECE8; --muted: #9AA8A1; --line: #2B3431;
    --accent: #93A9EC; --accent-ink: #10162A; --accent-soft: #222B42; --free: #1C2B23; --free-ink: #A3D1B6;
    --warn: #E2B66B; --warn-soft: #2E2615; --danger: #E68888; --danger-soft: #3A1F1F;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111614; --surface: #1A201E; --ink: #E5ECE8; --muted: #9AA8A1; --line: #2B3431;
  --accent: #93A9EC; --accent-ink: #10162A; --accent-soft: #222B42; --free: #1C2B23; --free-ink: #A3D1B6;
  --warn: #E2B66B; --warn-soft: #2E2615; --danger: #E68888; --danger-soft: #3A1F1F;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--f-ui); -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px));
}
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: 1.6rem; line-height: 1.2; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.num { font-variant-numeric: tabular-nums; }
.label { font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.row > .grow { flex: 1; min-width: 0; }
.section { display: flex; flex-direction: column; gap: 12px; padding-top: 28px; }

/* encabezado */
.wrap.wide { max-width: 880px; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; align-items: center; gap: 12px; padding-block: 14px 10px; border-bottom: 1px solid var(--line);
}
.top .grow { flex: 1; min-width: 0; }
.top .brand { font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* botones */
button, .btn {
  font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid transparent;
  padding: 10px 16px; font-weight: 600; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  text-decoration: none;
}
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.06); }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn-ghost:hover { background: var(--surface); }
.btn-text { background: none; color: var(--accent); padding: 8px 6px; min-height: 36px; }
.btn-danger { background: var(--danger); color: var(--surface); }
.btn-block { width: 100%; }
button:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* formularios */
label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 500; font-size: .9rem; }
input[type=text], input[type=email], input[type=tel], input[type=password], input[type=number], input[type=date], input[type=time], select, textarea {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; min-height: 44px; width: 100%;
}
textarea { min-height: 70px; resize: vertical; }
.code-input { font-size: 1.4rem; letter-spacing: .3em; text-align: center; font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.switch { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.switch:last-child { border-bottom: 0; }
.switch .grow { flex: 1; min-width: 0; }
.switch input { appearance: none; width: 46px; height: 28px; border-radius: 14px; background: var(--line); position: relative; flex: none; cursor: pointer; transition: background .15s; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(18px); }

/* tarjetas y listas */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 16px; }
.panel.pad { padding: 16px; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.item { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; background: none; border-radius: 0; min-height: 60px; font-weight: 400; color: var(--ink); }
.item:last-child { border-bottom: 0; }
button.item:hover { background: var(--bg); }
.item .grow { flex: 1; min-width: 0; }
.item .title { font-weight: 600; }
.date-chip { width: 50px; flex: none; text-align: center; border-radius: 10px; background: var(--accent-soft); color: var(--accent); padding: 6px 0; line-height: 1.1; }
.date-chip b { display: block; font-family: var(--f-display); font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.date-chip span { font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.pill { display: inline-flex; align-items: center; font-size: .75rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--bg); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--free); color: var(--free-ink); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--danger-soft); color: var(--danger); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.empty { padding: 22px 16px; text-align: center; color: var(--muted); }
.note { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: .88rem; }
.note.info { background: var(--accent-soft); color: var(--accent); }

/* sesiones disponibles del paciente */
.credits { display: flex; align-items: center; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.credits .big { font-family: var(--f-display); font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; min-width: 1.4ch; text-align: center; }

/* carril de días */
.days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; scroll-snap-type: x proximity; }
.day {
  flex: none; width: 58px; padding: 8px 0; border-radius: 12px; background: var(--surface); border: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; gap: 0; color: var(--ink); min-height: 0; font-weight: 500; scroll-snap-align: start;
}
.day small { font-size: .68rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.day b { font-family: var(--f-display); font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.day i { font-style: normal; font-size: .7rem; color: var(--muted); height: 1em; line-height: 1; }
.day.sel { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.day.sel small, .day.sel i { color: var(--accent-ink); }
.day.off { opacity: .55; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.slot { background: var(--free); color: var(--free-ink); font-variant-numeric: tabular-nums; border: 1px solid transparent; }
.slot.sel { background: var(--accent); color: var(--accent-ink); }

/* calendario de dos semanas */
.cal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.cal-head { display: flex; align-items: center; gap: 4px; }
.cal-head .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; padding-left: 4px; }
.cal-head .x { font-size: 1.4rem; line-height: 1; min-width: 40px; color: var(--ink); }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-dow { font-size: .66rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: center; padding-bottom: 2px; }
.cal-day {
  min-height: 86px; padding: 5px 3px; border-radius: 8px; background: var(--bg); border: 1px solid transparent;
  display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 2px;
  font-weight: 400; color: var(--ink); text-align: left; min-width: 0; overflow: hidden;
}
.cal-day:hover { border-color: var(--line); }
.cal-n { font-family: var(--f-display); font-weight: 600; font-size: .95rem; font-variant-numeric: tabular-nums; padding-left: 2px; }
.cal-day.hoy .cal-n { color: var(--accent); }
.cal-day.hoy .cal-n::after { content: "hoy"; font-family: var(--f-ui); font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-left: 3px; vertical-align: 2px; }
.cal-day.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cal-day.pas { opacity: .55; }
.cal-day.bloq { background: repeating-linear-gradient(135deg, var(--danger-soft) 0 6px, var(--bg) 6px 12px); }
.cal-t {
  display: flex; gap: 4px; align-items: baseline; min-width: 0; font-size: .66rem; line-height: 1.25;
  background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 2px 3px; white-space: nowrap;
}
.cal-t b { font-variant-numeric: tabular-nums; font-weight: 700; }
.cal-t em { font-style: normal; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.cal-x { font-size: .62rem; font-weight: 700; color: var(--danger); padding-left: 2px; }
.cal-mas { font-size: .62rem; color: var(--muted); padding-left: 2px; }
@media (max-width: 459px) { .cal-t em { display: none; } .cal-t { justify-content: center; } }

.danger-zone { border-top: 1px solid var(--line); padding-top: 18px; margin-top: 6px; }
.del-btn { color: var(--danger); border-color: var(--danger-soft); }
.del-btn:hover { background: var(--danger-soft); }

/* selector de días */
.dow-pick { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.dow { position: relative; }
.dow input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.dow span { display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: .85rem; color: var(--muted); }
.dow input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.dow input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* paquete y rutina */
.paq { display: flex; flex-direction: column; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.paq-big { font-size: 1rem; color: var(--muted); }
.paq-big b { font-family: var(--f-display); font-size: 2rem; color: var(--ink); font-weight: 600; margin-right: 2px; }
.paq-bar { display: flex; height: 8px; border-radius: 4px; background: var(--bg); overflow: hidden; border: 1px solid var(--line); }
.paq-bar i { display: block; height: 100%; }
.paq-bar .u { background: var(--muted); }
.paq-bar .a { background: var(--accent); }
.paq-stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .85rem; color: var(--muted); }
.paq-stats b { color: var(--ink); }
.file-ic { width: 44px; height: 52px; flex: none; border-radius: 6px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: .7rem; font-weight: 800; letter-spacing: .05em; }
.rutina-on { background: var(--accent); color: var(--accent-ink); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.rutina-on .btn { background: var(--accent-ink); color: var(--accent); }
.rutina-on .small { opacity: .85; }
.pill.n { background: var(--accent-soft); color: var(--accent); font-variant-numeric: tabular-nums; }
.viewer { position: fixed; inset: 0; z-index: 25; background: var(--bg); display: flex; flex-direction: column; }
.viewer-top { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); background: var(--surface);
  padding-top: max(10px, env(safe-area-inset-top, 0px)); padding-bottom: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.viewer-top .grow { flex: 1; min-width: 0; }
.viewer-top b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.viewer-body { flex: 1; overflow: auto; display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding-block: 12px calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.viewer-body canvas, .viewer-body img { max-width: 100%; height: auto; background: #fff; box-shadow: var(--shadow); border-radius: 4px; user-select: none; -webkit-user-drag: none; -webkit-touch-callout: none; }

/* agenda del profesional */
.agenda { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.arow { display: grid; grid-template-columns: 58px 1fr auto; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); min-height: 56px; }
.arow:last-child { border-bottom: 0; }
.arow .h { font-variant-numeric: tabular-nums; font-weight: 700; font-size: .95rem; }
.arow .who { min-width: 0; }
.arow.free .who { color: var(--free-ink); font-weight: 500; }
.arow.busy { box-shadow: inset 3px 0 0 var(--accent); }
.arow.gone { color: var(--muted); }
.arow.grupo { align-items: start; padding-block: 12px; }
.arow.grupo .h { padding-top: 2px; }
.g-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.g-list { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; }
.g-list li { display: flex; align-items: center; gap: 8px; border-top: 1px dashed var(--line); min-height: 40px; }
.g-n { flex: 1; min-width: 0; font-weight: 600; }
.g-x { min-height: 36px; font-size: .85rem; color: var(--muted); }
.slot small { display: block; font-size: .68rem; font-weight: 600; opacity: .8; }
.arow.gone .who { text-decoration: line-through; }
.blocked { display: flex; align-items: center; gap: 12px; background: var(--danger-soft); color: var(--danger); border-radius: var(--r); padding: 14px 16px; }

/* barra inferior */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  display: flex; justify-content: center;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.tabs > div { display: flex; width: 100%; max-width: 560px; }
.tab { flex: 1; background: none; border-radius: 0; color: var(--muted); padding: 12px 4px; min-height: 58px; font-weight: 600; font-size: .85rem; flex-direction: column; gap: 2px; }
.tab svg { width: 22px; height: 22px; }
.tab.on { color: var(--accent); }

/* hoja modal */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(10, 14, 12, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--bg); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 18px 18px 0 0;
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(22px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 16px; animation: up .18s ease-out;
}
@media (min-width: 620px) { .scrim { align-items: center; } .sheet { border-radius: 18px; } }
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet-head { display: flex; align-items: center; gap: 10px; }
.sheet-head h2 { flex: 1; }
.x { background: none; color: var(--muted); min-height: 40px; padding: 6px 10px; }

/* login */
.login { min-height: 80vh; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding-top: 40px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { background: none; color: var(--muted); min-height: 40px; }
.seg button.on { background: var(--accent-soft); color: var(--accent); }

/* demo y avisos */
.demo { background: var(--warn-soft); color: var(--warn); border-radius: var(--r); padding: 12px 14px; font-size: .86rem; display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
.demo code { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 30; max-width: min(92vw, 480px);
  bottom: calc(76px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; font-size: .9rem; font-weight: 500; box-shadow: var(--shadow);
}
.spin { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s 0.8s linear infinite; margin: 60px auto; }
@keyframes s { to { transform: rotate(360deg); } }
.share { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 12px; font-size: .88rem; white-space: pre-wrap; word-break: break-word; user-select: all; }
.hrow { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) 54px 36px; gap: 6px; align-items: center; }
.hrow .x { min-width: 36px; padding: 6px 0; font-size: 1.2rem; line-height: 1; }
.hrow input { min-width: 0; padding-inline: 8px; }
.hhead { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) 54px 36px; gap: 8px; font-size: .72rem; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.hhead span:last-child { visibility: hidden; }
</style>

<div id="app"><div class="spin" role="status" aria-label="Cargando"></div></div>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>


<script>
(function () {
  var DIAS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
  var DCORTO = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
  var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  var MCORTO = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  var KEY = 'agenda-sesion';
  var $app = document.getElementById('app'), $modal = document.getElementById('modal'), $toast = document.getElementById('toast');

  /* ---------- visor de rutina ---------- */
  var PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';

      }

  function cupoEn(f, m) {
    var c = S.d.config, dur = c.duracion, d = dt(f).getUTCDay(), cap = 0;
    S.d.horarios.forEach(function (h) {
      if (h.dia === d && mins(h.inicio) <= m && m + dur <= mins(h.fin)) cap = Math.max(cap, h.cupos || 0);
    });
    return Math.max(1, cap || c.cupos || 1);
  }
  /* una fila por horario: quiénes están, cuántos lugares tiene y cuántos quedan */
  function filasDia(f) {
    var c = S.d.config, dur = c.duracion, paso = dur + c.separacion, dow = dt(f).getUTCDay();
    var turnos = S.d.turnos.filter(function (t) { return t.fecha === f; });
    var activos = turnos.filter(function (t) { return t.estado === 'reservado'; });
    var esHoy = f === S.d.hoy, ahora = mins(horaAR()), futuro = f > S.d.hoy || f === S.d.hoy;
    var filas = {}, usados = {};
    S.d.horarios.filter(function (h) { return h.dia === dow; }).forEach(function (h) {
      for (var m = mins(h.inicio); m + dur <= mins(h.fin); m += paso) {
        var hh = hhmm(m); if (filas[hh]) continue;
        filas[hh] = { hora: hh, cap: cupoEn(f, m), turnos: [], bajas: [], pasado: !futuro || (esHoy && m < ahora) };
      }
    });
    activos.forEach(function (t) {
      if (!filas[t.hora]) filas[t.hora] = { hora: t.hora, cap: cupoEn(f, mins(t.hora)), turnos: [], bajas: [], pasado: !futuro || (esHoy && mins(t.hora) < ahora) };
      filas[t.hora].turnos.push(t);
    });
    turnos.filter(function (t) { return t.estado !== 'reservado'; }).forEach(function (t) {
      if (!filas[t.hora]) filas[t.hora] = { hora: t.hora, cap: 1, turnos: [], bajas: [], pasado: true, soloBajas: true };
      filas[t.hora].bajas.push(t);
    });
    var lista = Object.keys(filas).sort().map(function (k) { return filas[k]; });
    // un horario individual tapado por una sesión que se superpone no se ofrece libre
    lista.forEach(function (r) {
      var m = mins(r.hora);
      var otros = activos.filter(function (t) { var a = mins(t.hora); return t.hora !== r.hora && m < a + dur && a < m + dur; }).length;
      r.libres = r.pasado ? 0 : Math.max(0, r.cap - r.turnos.length - otros);
    });
    return lista.filter(function (r) { return r.turnos.length || r.bajas.length || !r.pasado; });
  }

  function calendario(bloq) {
    var d = S.d, hoy = d.hoy, off = S.sem || 0;
    var lunes = sum(hoy, -((dt(hoy).getUTCDay() + 6) % 7) + 7 * off);
    var porDia = {};
    d.turnos.forEach(function (t) { if (t.estado === 'reservado') (porDia[t.fecha] = porDia[t.fecha] || []).push(t); });
    var fin = sum(lunes, 13), a = dt(lunes), b = dt(fin);
    var rango = a.getUTCDate() + (a.getUTCMonth() !== b.getUTCMonth() ? ' ' + MCORTO[a.getUTCMonth()] : '') + ' al ' + b.getUTCDate() + ' ' + MCORTO[b.getUTCMonth()];
    var titulo = off === 0 ? 'Esta semana y la próxima' : off === 1 ? 'Próximas dos semanas' : off < 0 ? 'Semanas anteriores' : 'Más adelante';
    var html = '<div class="cal"><div class="cal-head"><button class="x" data-act="cal-sem" data-v="-1" aria-label="Semana anterior"' + (off <= -2 ? ' disabled' : '') + '>‹</button>' +
      '<div class="grow"><b>' + titulo + '</b><span class="muted small num">' + rango + '</span></div>' +
      (off !== 0 ? '<button class="btn-text" data-act="cal-sem" data-v="0">Hoy</button>' : '') +
      '<button class="x" data-act="cal-sem" data-v="1" aria-label="Semana siguiente"' + (off >= 24 ? ' disabled' : '') + '>›</button></div>' +
      '<div class="cal-grid">' + ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].map(function (n) { return '<span class="cal-dow">' + n + '</span>'; }).join('');
    for (var i = 0; i < 14; i++) {
      var f = sum(lunes, i), ts = (porDia[f] || []).sort(function (x, y) { return x.hora < y.hora ? -1 : 1; });
      var cls = 'cal-day' + (f === S.dia ? ' sel' : '') + (f === hoy ? ' hoy' : '') + (f < hoy ? ' pas' : '') + (bloq[f] ? ' bloq' : '');
      html += '<button class="' + cls + '" data-act="a-dia" data-f="' + f + '" aria-label="' + larga(f) + ', ' + ts.length + ' sesiones">' +
        '<span class="cal-n">' + dt(f).getUTCDate() + '</span>' +
        (bloq[f] ? '<span class="cal-x">Bloq.</span>' : '') +
        ts.slice(0, 4).map(function (t) {
          var p = pac(t.paciente_id);
          return '<span class="cal-t"><b>' + t.hora + '</b><em>' + esc(p ? p.nombre.split(' ')[0] : '') + '</em></span>';
        }).join('') +
        (ts.length > 4 ? '<span class="cal-mas">+' + (ts.length - 4) + ' más</span>' : '') + '</button>';
    }
    return html + '</div></div>';
  }

  function vAgenda() {
    var d = S.d, hoy = d.hoy, bloq = {};

      var nq = quedan.reduce(function (a, r) { return a + r.turnos.length; }, 0);

  function nombreDe(t) { var p = pac(t.paciente_id); return p ? p.nombre : 'Paciente eliminado'; }

  function listaAgenda(filas) {

      f.querySelectorAll('[data-dia]').forEach(function (box) {
        box.querySelectorAll('.hrow').forEach(function (r) {
          var t = r.querySelectorAll('input'); if (t[0].value && t[1].value) hs.push({ dia: +box.dataset.dia, inicio: t[0].value.slice(0, 5), fin: t[1].value.slice(0, 5), cupos: +t[2].value || 0 });
        });
      });
      ocupado(btn, true);
      call('apiGuardarConfig', S.cred, cfg).then(function () { return call('apiGuardarHorarios', S.cred, hs); })
        .then(function () { toast('Ajustes guardados.'); return recargar(); })
        .catch(function (e) { ocupado(btn, false); toast(e.message); });
    }
  });
})();
</script>

</body>
</html>
